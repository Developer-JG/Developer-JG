name: Generate Original GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/original-profile.yml'

permissions:
  contents: write

concurrency:
  group: original-github-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p profile-assets

      - name: GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default
          path: profile-assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=default
          path: profile-assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: GitHub trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=flat&column=7
          path: profile-assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-assets/github-contribution-grid-snake.svg

      - name: Commit and push generated images (retry on remote updates)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the freshly generated images while synchronizing main.
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp profile-assets/*.svg "$temp_dir/"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p profile-assets
            cp "$temp_dir"/*.svg profile-assets/
            git add profile-assets/*.svg

            if git diff --cached --quiet; then
              echo "Generated images are already up to date."
              exit 0
            fi

            git commit -m "chore: update original GitHub profile images"
            if git push origin HEAD:main; then
              echo "Profile images pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Push rejected; remote moved. Retrying after fetching the latest main ($attempt/5)."
              sleep "$((attempt * 2))"
            fi
          done

          echo "::error::Unable to push generated images after 5 attempts. Check branch protection and write permissions."
          exit 1
