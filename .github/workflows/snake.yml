name: Update Contribution Snake

# Replaces the old `* */3 * * *` schedule, which actually runs
# every minute during eight different hours each day.
on:
  schedule:
    - cron: '23 1 * * *' # Once a day, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
